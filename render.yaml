services:
  - type: web
    name: vowsandvenues-staging
    env: node
    plan: starter
    region: oregon
    branch: staging
    buildCommand: yarn install --production=false --frozen-lockfile && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: APP_ENV
        value: staging
      - key: USE_LOCAL_DB
        value: "false"
      - key: DB_NAME
        value: vows_and_venues_staging
      - key: CORS_ORIGINS
        value: https://vowsandvenues-staging.onrender.com,http://localhost:3000
      - key: PAYMENT_GATEWAY_MODE
        value: sandbox
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SEED_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URL
        fromEnvVar: MONGODB_URI
      - key: REQUIRE_COMPLETED_BOOKING_FOR_REVIEW
        value: "false"
